<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>RGB Display Controller Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;
overflow:hidden;

background:linear-gradient(
135deg,
#ff0000,
#0000ff
);

display:flex;
justify-content:center;
align-items:center;

transition:0.3s;
}

.container{

width:95%;
max-width:420px;

background:rgba(255,255,255,0.08);

backdrop-filter:blur(18px);

border:1px solid rgba(255,255,255,0.15);

border-radius:30px;

padding:25px;

box-shadow:
0 0 40px rgba(0,0,0,0.5);

}

.logo{

text-align:center;
color:white;
font-size:34px;
font-weight:700;
margin-bottom:5px;

}

.subtitle{

text-align:center;
color:#dddddd;
margin-bottom:25px;

}

.color-preview{

height:130px;
border-radius:25px;

background:rgb(255,0,0);

box-shadow:
0 0 30px rgba(255,255,255,0.2);

margin-bottom:25px;

transition:0.3s;
}

.control{

margin-bottom:18px;

}

.label{

display:flex;
justify-content:space-between;

color:white;
margin-bottom:8px;
font-size:14px;

}

input[type=range]{

width:100%;
height:10px;
border-radius:20px;
appearance:none;
outline:none;

background:rgba(255,255,255,0.15);

}

input[type=range]::-webkit-slider-thumb{

appearance:none;

width:22px;
height:22px;

border-radius:50%;

background:white;

cursor:pointer;

}

.buttons{

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;

margin-top:25px;

}

button{

padding:15px;

border:none;
border-radius:18px;

font-size:15px;
font-weight:600;

cursor:pointer;

transition:0.3s;

color:white;

background:rgba(255,255,255,0.12);

backdrop-filter:blur(10px);

}

button:hover{

transform:scale(1.05);

background:rgba(255,255,255,0.2);

}

.hex{

text-align:center;
margin-top:22px;

font-size:24px;
font-weight:700;

color:white;

letter-spacing:2px;

}

.footer{

margin-top:25px;

text-align:center;

color:#cccccc;
font-size:12px;

}

</style>
</head>

<body>

<div class="container">

<div class="logo">
RGB PRO
</div>

<div class="subtitle">
Professional RGB Display Controller
</div>

<div class="color-preview"
id="preview">
</div>

<div class="control">

<div class="label">
<span>RED</span>
<span id="redValue">255</span>
</div>

<input type="range"
id="red"
min="0"
max="255"
value="255">

</div>

<div class="control">

<div class="label">
<span>GREEN</span>
<span id="greenValue">0</span>
</div>

<input type="range"
id="green"
min="0"
max="255"
value="0">

</div>

<div class="control">

<div class="label">
<span>BLUE</span>
<span id="blueValue">0</span>
</div>

<input type="range"
id="blue"
min="0"
max="255"
value="0">

</div>

<div class="control">

<div class="label">
<span>BRIGHTNESS</span>
<span id="brightnessValue">100%</span>
</div>

<input type="range"
id="brightness"
min="10"
max="100"
value="100">

</div>

<div class="buttons">

<button onclick="randomColor()">
Random
</button>

<button onclick="startBlink()">
Blink
</button>

<button onclick="gradientMode()">
Gradient
</button>

<button onclick="fullscreenMode()">
Fullscreen
</button>

</div>

<div class="hex"
id="hexCode">
#FF0000
</div>

<div class="footer">
Created by TechBinders
</div>

</div>

<script>

const red =
document.getElementById("red");

const green =
document.getElementById("green");

const blue =
document.getElementById("blue");

const brightness =
document.getElementById("brightness");

const preview =
document.getElementById("preview");

const hexCode =
document.getElementById("hexCode");

let blinking = false;

function updateColor(){

const r = red.value;
const g = green.value;
const b = blue.value;

document.getElementById(
"redValue").innerText = r;

document.getElementById(
"greenValue").innerText = g;

document.getElementById(
"blueValue").innerText = b;

document.getElementById(
"brightnessValue").innerText =
brightness.value + "%";

const rgb =
`rgb(${r},${g},${b})`;

preview.style.background = rgb;

document.body.style.background =
`linear-gradient(
135deg,
rgba(${r},${g},${b},0.9),
black
)`;

document.body.style.filter =
`brightness(${brightness.value}%)`;

const hex =
"#" +
((1 << 24)
+
(parseInt(r) << 16)
+
(parseInt(g) << 8)
+
parseInt(b))
.toString(16)
.slice(1)
.toUpperCase();

hexCode.innerText = hex;

}

red.addEventListener(
"input",updateColor);

green.addEventListener(
"input",updateColor);

blue.addEventListener(
"input",updateColor);

brightness.addEventListener(
"input",updateColor);

function randomColor(){

red.value =
Math.floor(Math.random()*256);

green.value =
Math.floor(Math.random()*256);

blue.value =
Math.floor(Math.random()*256);

updateColor();

}

function startBlink(){

if(blinking) return;

blinking = true;

let visible = true;

setInterval(()=>{

preview.style.opacity =
visible ? "0" : "1";

visible = !visible;

},300);

}

function gradientMode(){

document.body.style.background =
"linear-gradient(135deg,#ff0000,#00ffcc,#0000ff,#ff00ff)";

}

function fullscreenMode(){

document.documentElement
.requestFullscreen();

}

updateColor();

</script>

</body>
  </html>
